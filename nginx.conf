server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  server_tokens off;

  if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / { try_files $uri $uri/ =404; }
  location ~* \.(css|js|png|svg|ico)$ { expires 30d; add_header Cache-Control "public"; add_header X-Content-Type-Options nosniff always; }
  error_page 404 /404.html;
}
